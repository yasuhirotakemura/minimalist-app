version: "2"
sql:
  - engine: postgresql
    schema: ../../db/migrations
    queries: ./sql/queries
    gen:
      go:
        package: sqlc
        out: ./internal/generated/sqlc
        sql_package: pgx/v5
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # pgxのInetCodecはbinary形式のinetをstringへscanできないため、
          # netip.Addr へ対応付ける。
          - db_type: "inet"
            go_type:
              import: "net/netip"
              type: "Addr"
          - db_type: "inet"
            nullable: true
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true
