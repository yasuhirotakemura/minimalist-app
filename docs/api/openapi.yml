    # ---------------------------------------------------------------------
    # Storage unit (設計書 13.8 / 16章)
    # ---------------------------------------------------------------------
    StorageUnitReferenceResponse:
      type: object
      description: 他resourceから参照する際の最小表現
      required: [publicId, name]
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
        name:
          type: string
          example: 日常リュック

    StorageUnitCapacityResponse:
      type: object
      description: |
        収納単位の重量・容積の集計と超過判定 (設計書 16.2 / 16.3)。

        重量の内訳:
          tareWeightGram        : 本収納単位の自重
          itemWeightGram        : 直接割当されたアイテムの重量合計
          descendantWeightGram  : 子孫収納単位の自重と内容物重量の合計
          totalWeightGram       = tareWeightGram + itemWeightGram + descendantWeightGram

        親と子で同じ重量を二重計上しないため、descendantWeightGramには
        親自身の自重・直接割当分を含めない。

        重量・容積が未設定のアイテムが含まれる場合、既知分だけを合計し
        hasUnknownWeight / hasUnknownVolume を trueとする。
        未設定を0として扱い、完全な値に見せることはしない。
      required:
        - allocatedItemKindCount
        - allocatedQuantity
        - tareWeightGram
        - itemWeightGram
        - descendantWeightGram
        - totalWeightGram
        - itemVolumeMilliliter
        - descendantVolumeMilliliter
        - totalVolumeMilliliter
        - maximumWeightGram
        - maximumVolumeMilliliter
        - remainingWeightGram
        - remainingVolumeMilliliter
        - isWeightExceeded
        - isVolumeExceeded
        - hasUnknownWeight
        - hasUnknownVolume
      additionalProperties: false
      properties:
        allocatedItemKindCount:
          type: integer
          format: int32
          description: 直接割当されているアイテムの種類数
          example: 4
        allocatedQuantity:
          type: integer
          format: int64
          description: 直接割当されている数量の合計
          example: 7
        tareWeightGram:
          type: integer
          format: int64
          description: 本収納単位の自重。未設定の場合は0とし hasUnknownWeight をtrueとする。
          example: 900
        itemWeightGram:
          type: integer
          format: int64
          description: 直接割当されたアイテムの重量合計 (既知分のみ)
          example: 2400
        descendantWeightGram:
          type: integer
          format: int64
          description: 子孫収納単位の自重と内容物重量の合計 (既知分のみ)
          example: 1300
        totalWeightGram:
          type: integer
          format: int64
          example: 4600
        itemVolumeMilliliter:
          type: integer
          format: int64
          description: 直接割当されたアイテムの容積合計 (既知分のみ)
          example: 5200
        descendantVolumeMilliliter:
          type: integer
          format: int64
          description: |
            子孫収納単位の内容物容積の合計 (既知分のみ)。
            設計書 13.8 に収納単位自身の外寸容積columnが無いため、
            空の子収納単位が占める容積は含められない。
          example: 800
        totalVolumeMilliliter:
          type: integer
          format: int64
          example: 6000
        maximumWeightGram:
          type: integer
          format: int32
          nullable: true
          description: 最大重量。未設定の場合はnullとし、超過判定を行わない。
          example: 8000
        maximumVolumeMilliliter:
          type: integer
          format: int32
          nullable: true
          example: 25000
        remainingWeightGram:
          type: integer
          format: int64
          nullable: true
          description: |
            `maximumWeightGram - totalWeightGram`。
            最大重量が未設定の場合はnull。超過時は負値を返す。
          example: 3400
        remainingVolumeMilliliter:
          type: integer
          format: int64
          nullable: true
          example: 19000
        isWeightExceeded:
          type: boolean
          description: totalWeightGram が maximumWeightGram を超えたか (設計書 16.3)
        isVolumeExceeded:
          type: boolean
        hasUnknownWeight:
          type: boolean
          description: |
            自重、または集計対象アイテムのいずれかに重量が未設定のものがあるか。
            trueの場合、合計値は「入力済み分のみ」である (設計書 16.2)。
        hasUnknownVolume:
          type: boolean

    StorageUnitResponse:
      type: object
      description: 収納単位 (設計書 13.8)。内部IDを含めない。
      required:
        - publicId
        - name
        - storageTypeCode
        - storageTypeLabel
        - mobilityClassCode
        - mobilityClassLabel
        - parent
        - ancestors
        - depth
        - childCount
        - tareWeightGram
        - maximumWeightGram
        - maximumVolumeMilliliter
        - description
        - sortOrder
        - capacity
        - isArchived
        - archivedAt
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
        name:
          type: string
          example: 日常リュック
        storageTypeCode:
          $ref: "#/components/schemas/StorageTypeCode"
        storageTypeLabel:
          type: string
          example: バッグ
        mobilityClassCode:
          $ref: "#/components/schemas/MobilityClassCode"
        mobilityClassLabel:
          type: string
          example: 常時リュック
        parent:
          allOf:
            - $ref: "#/components/schemas/StorageUnitReferenceResponse"
          nullable: true
          description: 直接の親。親を持たない場合はnull。
        ancestors:
          type: array
          description: |
            rootから直接の親までの並び。階層のbreadcrumb表示に使用する。
            自身は含めない。
          items:
            $ref: "#/components/schemas/StorageUnitReferenceResponse"
        depth:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          description: 階層の深さ。rootは1。最大3 (設計書 7.3)。
          example: 1
        childCount:
          type: integer
          format: int32
          description: archive前の直接の子収納単位の件数
          example: 2
        tareWeightGram:
          type: integer
          format: int32
          nullable: true
          description: 収納単位自身の重量 (グラム)。未設定の場合はnull。
        maximumWeightGram:
          type: integer
          format: int32
          nullable: true
        maximumVolumeMilliliter:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          format: int32
          description: 画面の表示順。小さい順に表示する。
          example: 10
        capacity:
          $ref: "#/components/schemas/StorageUnitCapacityResponse"
        isArchived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: archive日時。DBの `deleted_at` に対応する。
        version:
          type: integer
          format: int32
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StorageUnitListResponse:
      type: object
      required: [items, pagination]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StorageUnitResponse"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"

    CreateStorageUnitRequest:
      type: object
      required: [name, storageTypeCode, mobilityClassCode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 日常リュック
        storageTypeCode:
          $ref: "#/components/schemas/StorageTypeCode"
        mobilityClassCode:
          $ref: "#/components/schemas/MobilityClassCode"
        parentStorageUnitPublicId:
          type: string
          format: uuid
          nullable: true
          description: |
            親収納単位。未指定時はrootとする。
            自身と合わせて階層が3を超える指定は 422 を返す。
        tareWeightGram:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          nullable: true
        maximumWeightGram:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          nullable: true
        maximumVolumeMilliliter:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000000
          nullable: true
        description:
          type: string
          maxLength: 500
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: 未指定時はserverが0を適用する。
          nullable: true

    UpdateStorageUnitRequest:
      type: object
      description: |
        全項目を置き換える。CreateStorageUnitRequestと同じ項目に
        `expectedVersion` を加える。
        allOfで合成せず明示的に列挙し `additionalProperties: false` を機能させる。
      required: [name, storageTypeCode, mobilityClassCode, expectedVersion]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        storageTypeCode:
          $ref: "#/components/schemas/StorageTypeCode"
        mobilityClassCode:
          $ref: "#/components/schemas/MobilityClassCode"
        parentStorageUnitPublicId:
          type: string
          format: uuid
          nullable: true
        tareWeightGram:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          nullable: true
        maximumWeightGram:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          nullable: true
        maximumVolumeMilliliter:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000000
          nullable: true
        description:
          type: string
          maxLength: 500
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          nullable: true
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: 楽観ロック用の現在version (設計書 11.7)

    StorageUnitVersionRequest:
      type: object
      description: archive・restoreのように追加入力を持たない操作で使用する。
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: 楽観ロック用の現在version (設計書 11.7)

    # ---------------------------------------------------------------------
    # Storage allocation (設計書 13.9)
    # ---------------------------------------------------------------------
    AllocatedItemResponse:
      type: object
      description: |
        収納割当から参照するアイテムの表現。
        収納内容編集画面が整合性表示 (現在数量・他収納への割当数量・未割当数量)
        を行うために必要な項目だけを持つ。
      required:
        - publicId
        - name
        - unitName
        - quantity
        - assignedQuantity
        - unassignedQuantity
        - weightGram
        - volumeMilliliter
        - isArchived
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
        name:
          type: string
          example: 半袖シャツ
        unitName:
          type: string
          example: 枚
        quantity:
          type: integer
          format: int32
          description: アイテムの所有数量
          example: 3
        assignedQuantity:
          type: integer
          format: int32
          description: 全収納単位への割当数量の合計
          example: 3
        unassignedQuantity:
          type: integer
          format: int32
          description: quantity - assignedQuantity
          example: 0
        weightGram:
          type: integer
          format: int32
          nullable: true
          description: nullの場合、収納単位の重量集計は不完全となる。
        volumeMilliliter:
          type: integer
          format: int32
          nullable: true
        isArchived:
          type: boolean
          description: |
            archive済みのアイテムか。
            archive済みアイテムへ新規割当はできないが、既存割当は保持する。
            archiveは手放しではなく、物理的には収納単位へ入ったままであるため
            容量集計にも含める。手放し時の整合はPhase 3で扱う。

    StorageAllocationResponse:
      type: object
      description: 収納単位配下の割当1件。親の収納単位は文脈から明らかなため含めない。
      required: [publicId, item, quantity, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
        item:
          $ref: "#/components/schemas/AllocatedItemResponse"
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: 本収納単位へ入れている数量。1以上。
          example: 2
        version:
          type: integer
          format: int32
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ItemStorageAllocationResponse:
      type: object
      description: アイテム側から見た割当1件。収納単位を参照として持つ。
      required: [publicId, storageUnit, quantity, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
        storageUnit:
          $ref: "#/components/schemas/StorageUnitReferenceResponse"
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2
        version:
          type: integer
          format: int32
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ItemStorageAllocationListResponse:
      type: object
      description: |
        1アイテムの収納割当一覧。
        件数が収納単位数で上限づけられるためpaginationを持たない。
      required: [items, quantity, assignedQuantity, unassignedQuantity]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemStorageAllocationResponse"
        quantity:
          type: integer
          format: int32
          description: アイテムの所有数量
          example: 3
        assignedQuantity:
          type: integer
          format: int32
          example: 3
        unassignedQuantity:
          type: integer
          format: int32
          example: 0

    StorageUnitContentsResponse:
      type: object
      description: |
        収納単位の内容。割当の追加・変更・削除・一括置換のresponseにも使用する。

        更新後のversion (収納単位・各割当)、容量集計、超過判定を1requestで
        返すことで、クライアントが追加requestなしに整合した画面を描ける。
      required: [storageUnit, allocations, childStorageUnits]
      additionalProperties: false
      properties:
        storageUnit:
          $ref: "#/components/schemas/StorageUnitResponse"
        allocations:
          type: array
          description: 直接割当されているアイテム。アイテム名昇順で返す。
          items:
            $ref: "#/components/schemas/StorageAllocationResponse"
        childStorageUnits:
          type: array
          description: 直接の子収納単位。archive済みは含めない。
          items:
            $ref: "#/components/schemas/StorageUnitResponse"

    CreateStorageAllocationRequest:
      type: object
      required: [itemPublicId, quantity, expectedStorageUnitVersion]
      additionalProperties: false
      properties:
        itemPublicId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          example: 2
        expectedStorageUnitVersion:
          type: integer
          format: int32
          minimum: 1
          description: |
            収納単位の現在version。割当集合の競合を検知する (設計書 11.7)。
            成功時に収納単位のversionを1増加させる。

    UpdateStorageAllocationRequest:
      type: object
      required: [quantity, expectedVersion, expectedStorageUnitVersion]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          example: 3
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: 収納割当の現在version
        expectedStorageUnitVersion:
          type: integer
          format: int32
          minimum: 1
          description: 収納単位の現在version

    StorageAllocationInput:
      type: object
      description: 一括置換で指定する割当1件。
      required: [itemPublicId, quantity]
      additionalProperties: false
      properties:
        itemPublicId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000

    SetStorageUnitAllocationsRequest:
      type: object
      description: |
        収納単位の割当集合を指定内容へ置き換える。
        含まれない既存割当は削除する。空配列は「中身を空にする」を意味する。
      required: [allocations, expectedStorageUnitVersion]
      additionalProperties: false
      properties:
        allocations:
          type: array
          maxItems: 500
          description: 同一アイテムを2件以上含めることはできない (400)。
          items:
            $ref: "#/components/schemas/StorageAllocationInput"
        expectedStorageUnitVersion:
          type: integer
          format: int32
          minimum: 1
