        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryPublicId:
          type: string
          format: uuid
        itemKindCode:
          allOf:
            - $ref: "#/components/schemas/ItemKindCode"
          description: 未指定時はserverが `durable` を適用する。
        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
        desiredQuantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          nullable: true
        unitName:
          type: string
          minLength: 1
          maxLength: 20
          description: 未指定時はserverが `個` を適用する。
        necessityLevelCode:
          $ref: "#/components/schemas/NecessityLevelCode"
        usageFrequencyCode:
          $ref: "#/components/schemas/UsageFrequencyCode"
        substitutabilityCode:
          $ref: "#/components/schemas/SubstitutabilityCode"
        mobilityClassCode:
          $ref: "#/components/schemas/MobilityClassCode"
        ownershipReason:
          type: string
          maxLength: 1000
          nullable: true
        disposalCondition:
          type: string
          maxLength: 1000
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        purchasedOn:
          type: string
          format: date
          nullable: true
        purchaseAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        replacementAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        resaleAmount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        weightGram:
          type: integer
          format: int32
          minimum: 0
          nullable: true
        volumeMilliliter:
          type: integer
          format: int32
          minimum: 0
          nullable: true
        isFragile:
          type: boolean
        isValuable:
          type: boolean
        isSentimental:
          type: boolean
        requiresMaintenance:
          type: boolean
        expiresOn:
          type: string
          format: date
          nullable: true
        sourceUrl:
          type: string
          maxLength: 2048
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        tagPublicIds:
          type: array
          maxItems: 30
          items:
            type: string
            format: uuid
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: 楽観ロック用の現在version (設計書 11.7)

    ItemVersionRequest:
      type: object
      description: archive・restoreのように追加入力を持たない操作で使用する。
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: 楽観ロック用の現在version (設計書 11.7)

    # ---------------------------------------------------------------------
    # Item usage record
    # ---------------------------------------------------------------------
    ItemUsageRecordResponse:
      type: object
      required: [publicId, usedAt, quantity, note, createdAt]
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
        usedAt:
          type: string
          format: date-time
        quantity:
          type: integer
          format: int32
          description: 使用した数量。
          example: 1
        note:
          type: string
          nullable: true
          example: 通勤時に使用
        createdAt:
          type: string
          format: date-time

    ItemUsageRecordListResponse:
      type: object
      required: [items, pagination]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemUsageRecordResponse"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"

    CreateItemUsageRecordRequest:
      type: object
      additionalProperties: false
      properties:
        usedAt:
          type: string
          format: date-time
          description: 使用日時。未指定時はserverの現在時刻を使用する。未来日時は許可しない。
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: 使用した数量。未指定時は1。
        note:
          type: string
          maxLength: 500
          nullable: true
