        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: archive日時。DBの `deleted_at` に対応する。
        version:
          type: integer
          format: int32
          description: 楽観ロック用のversion (設計書 11.7)
          example: 3
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

