        - mobilityClassCode
        - mobilityClassLabel
        - ownershipReason
        - disposalCondition
        - lastUsedAt
        - purchasedOn
        - purchaseAmount
        - replacementAmount
        - resaleAmount
        - weightGram
        - volumeMilliliter
        - isFragile
        - isValuable
        - isSentimental
        - requiresMaintenance
        - expiresOn
        - sourceUrl
        - notes
        - isConfirmed
        - confirmedAt
