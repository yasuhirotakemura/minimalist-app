openapi: 3.0.3

info:
  title: LESS API
  version: 0.1.0
  description: |
    LESSのREST API定義。本fileがフロントエンドとバックエンドの契約の正本である。

    現在のスコープは以下とする。
      - Phase 0: 認証 (F-001)
      - Phase 1: Category初期data / Item CRUD / 一覧filter / Tag / 使用記録 (F-003〜F-006)
      - Phase 2: StorageUnit / 収納割当 / 容量集計 / 携行区分 (F-008 / F-009)

    Review (Phase 3)、PurchaseCandidate (Phase 4)、Scenario (Phase 5)、
    Import/Export (Phase 6) はまだ定義しない。

    Phase 2で設計書と異なる判断をした点:
      - 更新は 設計書 12.4 の `PUT /api/storage-units/{publicId}` に従い全置換とする。
        PATCHによる部分更新は導入しない (Itemの `updateItem` と同じ方針)。
      - 重量・容積のfield名は設計書 13.7 / 13.8 のcolumn名に合わせ単数形
        (`tareWeightGram` / `maximumVolumeMilliliter` 等) とする。
        Phase 1の `weightGram` / `volumeMilliliter` と揃える。
      - 設計書 12.4 に無い `restore` / `contents` / 割当の個別操作 /
        `GET /items/{publicId}/storage-allocations` を追加した。
        いずれもPhase 2の要件 (収納内容編集・分割割当・未割当数量) に必要である。
      - 収納単位の親集計は設計書 16.2 が子孫を規定していないため、
        直接割当分 (`itemWeightGram`) と子孫分 (`descendantWeightGram`) を
        別fieldで返し、`totalWeightGram` で合算する。二重計上を避けるため
        子孫分には子孫自身の自重を含め、親の自重は含めない。

    共通仕様 (設計書 12.1):
      - base path: `/api`
      - Content-Type: `application/json`
      - datetime: RFC3339 (UTC)
      - JSON field: camelCase
      - enum value: lowercase snake_case
      - path: 複数形kebab-case
      - URLでは内部IDではなくpublicIdを使用する

    一覧のpagination:
      設計書 12.2 はcursor paginationを基本とするが、Item一覧は
      任意のsort keyとの組み合わせ、および総件数表示を要件とするため
      `limit` / `offset` によるoffset paginationとする。

    楽観ロック (設計書 11.7):
      更新・archive・restore・削除requestは `expectedVersion` を受け取る。
      現在のversionと一致しない場合は 409 を返す。

    `/health/live` と `/health/ready` は監視用endpointであり、
    `/api` prefixを持たないため本定義には含めない。

servers:
  - url: /api
    description: 同一オリジンのreverse proxy経由

tags:
  - name: auth
    description: ユーザー登録・login・logout・認証context
  - name: categories
    description: アイテムの主分類 (F-004)
  - name: tags
    description: アイテムへ付与する任意のlabel (F-005)
  - name: items
    description: 所持品の登録・取得・更新・archive・使用記録 (F-003 / F-006)
  - name: storage-units
    description: 収納単位と収納割当 (F-008 / F-009)

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: ユーザーを登録する
      description: |
        新しいユーザーを登録する。
        本endpointはsessionを発行しない。登録後は `POST /auth/login` でloginする。
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: 登録に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 同一emailのユーザーが既に存在する
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: EMAIL_ALREADY_REGISTERED
                message: このメールアドレスは既に登録されています。
                fieldErrors: []
                requestId: req_01JQ0000000000000000000000
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: loginする
      description: |
        email と password を検証し、session tokenをhttpOnly Cookieへ設定する。
        認証失敗時は、emailの存在有無を区別せず 401 を返す。
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: loginに成功した
          headers:
            Set-Cookie:
              description: session Cookie (HttpOnly, SameSite=Lax) とCSRF token Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: emailまたはpasswordが正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_CREDENTIALS
                message: メールアドレスまたはパスワードが正しくありません。
                fieldErrors: []
                requestId: req_01JQ0000000000000000000000
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logoutUser
      summary: logoutする
      description: |
        現在のsessionを失効させ、session Cookieを削除する。
        未認証状態で呼び出した場合も 204 を返す (冪等)。
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: logoutに成功した
          headers:
            Set-Cookie:
              description: 失効させたsession Cookie
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/context:
    get:
      tags: [auth]
      operationId: getAuthenticatedUserContext
      summary: 認証contextを取得する
      description: |
        現在のsessionに紐づくユーザー情報を返す。
        Web起動時に呼び出すことで、CSRF token Cookieの発行も同時に行われる。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 認証済みである
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: カテゴリー一覧を取得する
      description: |
        認証ユーザーのカテゴリーをsortOrder昇順で返す。
        カテゴリーはユーザー登録時に既定値が作成される。
        件数が少なく画面側で全件を保持するため、paginationを行わない。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: タグ一覧を取得する
      description: 認証ユーザーのタグを名称昇順で返す。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [tags]
      operationId: createTag
      summary: タグを登録する
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: 登録に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tags/{publicId}:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    put:
      tags: [tags]
      operationId: updateTag
      summary: タグを更新する
      description: |
        設計書 12.4 のendpoint一覧には含まれないが、
        タグ名の修正を行えるようにするため追加した。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: 更新に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [tags]
      operationId: deleteTag
      summary: タグを削除する
      description: |
        soft deleteする (設計書 1.4)。アイテムへの付与情報は保持したまま
        一覧・アイテムresponseから除外する。
        bodyを持たないmethodのため `expectedVersion` はquery parameterで受け取る。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          description: 楽観ロック用の現在version (設計書 11.7)
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "204":
          description: 削除に成功した
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items:
    get:
      tags: [items]
      operationId: listItems
      summary: 所持品一覧を取得する
      description: |
        認証ユーザーの所持品を検索・絞り込み・並び替えして返す (設計書 9.4)。
        archive済みのアイテムは既定で除外し、`includeDeleted=true` の場合のみ含める。
      security:
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          description: アイテム名またはメモの部分一致 (大文字小文字を区別しない)
          schema:
            type: string
            maxLength: 100
        - name: categoryPublicId
          in: query
          description: カテゴリーで絞り込む
          schema:
            type: string
            format: uuid
        - name: tagPublicId
          in: query
          description: タグで絞り込む
          schema:
            type: string
            format: uuid
        - name: necessityLevelCode
          in: query
          schema:
            $ref: "#/components/schemas/NecessityLevelCode"
        - name: usageFrequencyCode
          in: query
          schema:
            $ref: "#/components/schemas/UsageFrequencyCode"
        - name: mobilityClassCode
          in: query
          schema:
            $ref: "#/components/schemas/MobilityClassCode"
        - name: storageUnitPublicId
          in: query
          description: |
            指定した収納単位へ直接割当されているアイテムだけを返す (設計書 9.4)。
            子収納単位の内容は含めない。
          schema:
            type: string
            format: uuid
        - name: isUnassigned
          in: query
          description: |
            trueの場合、未割当数量が1以上のアイテムだけを返す (設計書 9.4)。
            未割当数量 = quantity - 収納割当数量の合計。
          schema:
            type: boolean
        - name: includeDeleted
          in: query
          description: archive済みのアイテムを含めるか。未指定時はfalse。
          schema:
            type: boolean
        - name: sort
          in: query
          description: 並び替えkey。未指定時は updatedAt。
          schema:
            $ref: "#/components/schemas/ItemSortKey"
        - name: order
          in: query
          description: 並び順。未指定時は desc。
          schema:
            $ref: "#/components/schemas/SortOrder"
        - $ref: "#/components/parameters/LimitQueryParameter"
        - $ref: "#/components/parameters/OffsetQueryParameter"
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [items]
      operationId: createItem
      summary: 所持品を登録する
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: 登録に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            指定したカテゴリーまたはタグが存在しない。
            他ユーザーのカテゴリー・タグを指定した場合も本statusを返す (設計書 18.3)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/{publicId}:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    get:
      tags: [items]
      operationId: getItemByPublicId
      summary: 所持品を取得する
      description: |
        他ユーザーのpublicIdを指定した場合も 404 を返し、
        存在有無を公開しない (設計書 18.3)。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [items]
      operationId: updateItem
      summary: 所持品を更新する
      description: |
        全項目を置き換える。省略した任意項目はNULLへ更新される。
        `expectedVersion` が現在versionと一致しない場合は 409 を返す。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: 更新に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/{publicId}/archive:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    post:
      tags: [items]
      operationId: archiveItem
      summary: 所持品をarchiveする
      description: |
        soft deleteとして `archivedAt` を設定する (設計書 1.4)。
        archive済みのアイテムは既定の一覧から除外され、使用記録を追加できない。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVersionRequest"
      responses:
        "200":
          description: archiveに成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/{publicId}/restore:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    post:
      tags: [items]
      operationId: restoreItem
      summary: archive済みの所持品を復元する
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVersionRequest"
      responses:
        "200":
          description: 復元に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/{publicId}/usage-records:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    get:
      tags: [items]
      operationId: listItemUsageRecords
      summary: 使用記録の履歴を取得する
      description: 使用日時の降順で返す。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/LimitQueryParameter"
        - $ref: "#/components/parameters/OffsetQueryParameter"
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemUsageRecordListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [items]
      operationId: createItemUsageRecord
      summary: 使用記録を登録する
      description: |
        登録と同時にアイテムの最終使用日時を更新する。
        既存の最終使用日時より古い記録では更新しない。
        archive済みのアイテムへは登録できず 422 を返す (設計書 7.2)。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemUsageRecordRequest"
      responses:
        "201":
          description: 登録に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemUsageRecordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/{publicId}/storage-allocations:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    get:
      tags: [items]
      operationId: listItemStorageAllocations
      summary: 所持品の収納割当を取得する
      description: |
        1つのアイテムがどの収納単位へ何個ずつ入っているかを返す。
        同一アイテムを複数収納単位へ分割割当できるため複数件になる (F-009)。

        1アイテムの割当件数は収納単位数で上限が決まり少数であるため、
        paginationを行わず全件を返す。
        `unassignedQuantity` はDBへ保存せず取得時に算出する。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemStorageAllocationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units:
    get:
      tags: [storage-units]
      operationId: listStorageUnits
      summary: 収納単位一覧を取得する
      description: |
        認証ユーザーの収納単位を検索・絞り込み・並び替えして返す (F-008)。
        archive済みは既定で除外し、`includeArchived=true` の場合のみ含める。

        各要素は `capacity` に重量・容積の集計と超過判定を含む。
        集計は子孫収納単位を含むため、pageに含まれない収納単位も
        server側で階層をたどって計算する。
      security:
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          description: 収納単位名または説明の部分一致 (大文字小文字を区別しない)
          schema:
            type: string
            maxLength: 100
        - name: storageTypeCode
          in: query
          schema:
            $ref: "#/components/schemas/StorageTypeCode"
        - name: mobilityClassCode
          in: query
          schema:
            $ref: "#/components/schemas/MobilityClassCode"
        - name: parentStorageUnitPublicId
          in: query
          description: 指定した収納単位の直接の子だけを返す。
          schema:
            type: string
            format: uuid
        - name: rootOnly
          in: query
          description: |
            trueの場合、親を持たない収納単位だけを返す。
            `parentStorageUnitPublicId` と同時に指定した場合は 400 を返す。
          schema:
            type: boolean
        - name: includeArchived
          in: query
          description: |
            archive済みの収納単位を含めるか。未指定時はfalse。
            Itemの `includeDeleted` と役割は同じだが、収納単位はarchiveのみを
            利用者へ見せるため名称を `includeArchived` とした。
          schema:
            type: boolean
        - name: sort
          in: query
          description: 並び替えkey。未指定時は sortOrder。
          schema:
            $ref: "#/components/schemas/StorageUnitSortKey"
        - name: order
          in: query
          description: 並び順。未指定時は asc (sortOrder) / desc (updatedAt) ではなく常に指定値を使う。未指定時は asc。
          schema:
            $ref: "#/components/schemas/SortOrder"
        - $ref: "#/components/parameters/LimitQueryParameter"
        - $ref: "#/components/parameters/OffsetQueryParameter"
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [storage-units]
      operationId: createStorageUnit
      summary: 収納単位を登録する
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageUnitRequest"
      responses:
        "201":
          description: 登録に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            指定した親収納単位が存在しない。
            他ユーザーの収納単位を指定した場合も本statusを返す (設計書 18.3)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            業務ルール違反。以下を含む。
              - 階層が3を超える (`STORAGE_HIERARCHY_TOO_DEEP`)
              - archive済みの収納単位を親に指定した (`STORAGE_UNIT_PARENT_ARCHIVED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    get:
      tags: [storage-units]
      operationId: getStorageUnitByPublicId
      summary: 収納単位を取得する
      description: |
        他ユーザーのpublicIdを指定した場合も 404 を返し、
        存在有無を公開しない (設計書 18.3)。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [storage-units]
      operationId: updateStorageUnit
      summary: 収納単位を更新する
      description: |
        全項目を置き換える。省略した任意項目はNULLへ更新される。
        `expectedVersion` が現在versionと一致しない場合は 409 を返す。

        `parentStorageUnitPublicId` の変更で階層が移動する。
        自分自身・子孫を親に指定した場合、および移動後の階層が3を超える場合は
        422 を返す。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageUnitRequest"
      responses:
        "200":
          description: 更新に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            業務ルール違反。以下を含む。
              - 自分自身を親に指定した (`STORAGE_UNIT_SELF_PARENT`)
              - 子孫を親に指定した (`STORAGE_UNIT_CIRCULAR_PARENT`)
              - 階層が3を超える (`STORAGE_HIERARCHY_TOO_DEEP`)
              - archive済みの収納単位を親に指定した (`STORAGE_UNIT_PARENT_ARCHIVED`)
              - archive済みの収納単位を編集した (`STORAGE_UNIT_ARCHIVED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}/archive:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    post:
      tags: [storage-units]
      operationId: archiveStorageUnit
      summary: 収納単位をarchiveする
      description: |
        soft deleteとして `archivedAt` を設定する (設計書 1.4)。

        以下の場合は 422 を返し、親のarchiveで子を暗黙にarchiveしない。
          - archive前の子収納単位が残っている (`STORAGE_UNIT_HAS_CHILDREN`)
          - 収納割当が残っている (`STORAGE_UNIT_HAS_ALLOCATIONS`)

        いずれも利用者へ「子を先にarchiveする」「中身を先に出す」ことを求める。
        暗黙のcascadeを行わないことで、復元時の状態を予測可能にする。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUnitVersionRequest"
      responses:
        "200":
          description: archiveに成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}/restore:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    post:
      tags: [storage-units]
      operationId: restoreStorageUnit
      summary: archive済みの収納単位を復元する
      description: |
        親がarchive済みの場合は 422 を返す (`STORAGE_UNIT_PARENT_ARCHIVED`)。
        階層の不整合を作らないため、親から順に復元させる。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUnitVersionRequest"
      responses:
        "200":
          description: 復元に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}/capacity:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    get:
      tags: [storage-units]
      operationId: getStorageUnitCapacity
      summary: 収納単位の重量・容積を取得する
      description: |
        設計書 16.2 の使用量と 16.3 の超過警告を返す。

        収納済みアイテムの一部に重量または容積が未設定の場合、
        既知分だけを合計し `hasUnknownWeight` / `hasUnknownVolume` を trueとする。
        未設定値を0として完全な値に見せない。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitCapacityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}/contents:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    get:
      tags: [storage-units]
      operationId: getStorageUnitContents
      summary: 収納単位の内容を取得する
      description: |
        直接割当されているアイテム、直接の子収納単位、容量集計をまとめて返す。
        収納内容編集画面が1requestで必要な情報を得られるようにする。

        1収納単位の割当件数は実運用で少数に収まるためpaginationを行わない。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 取得に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}/allocations:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"

    post:
      tags: [storage-units]
      operationId: createStorageAllocation
      summary: 所持品を収納単位へ割り当てる
      description: |
        数量付きで割り当てる (F-009)。

        制約:
          - 割当数量は1以上
          - 同一収納単位と同一アイテムの組み合わせは1件 (409)
          - 同一アイテムの割当数量合計は所有数量以下 (422)
          - archive済みアイテム・archive済み収納単位へは割当できない (422)

        割当集合の競合を検知するため `expectedStorageUnitVersion` を要求し、
        成功時に収納単位のversionを1増加させる。
        responseは更新後の収納内容全体を返す。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageAllocationRequest"
      responses:
        "201":
          description: 割当に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            version競合、または同一アイテムが既に本収納単位へ割当済みである
            (`STORAGE_ALLOCATION_ALREADY_EXISTS`)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [storage-units]
      operationId: setStorageUnitAllocations
      summary: 収納単位の割当を一括置換する
      description: |
        設計書 12.4 の `setStorageUnitAllocations`。
        指定した割当集合へ置き換える。含まれない既存割当は削除する。

        `expectedStorageUnitVersion` で割当集合全体の競合を検知する。
        競合時はクライアント入力でserver状態を上書きせず 409 を返す。

        単一transactionで実行し、対象アイテム行を `SELECT FOR UPDATE` で
        ロックしてから割当数量合計を検証する (設計書 20章)。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStorageUnitAllocationsRequest"
      responses:
        "200":
          description: 置換に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /storage-units/{publicId}/allocations/{allocationPublicId}:
    parameters:
      - $ref: "#/components/parameters/PublicIdPathParameter"
      - $ref: "#/components/parameters/AllocationPublicIdPathParameter"

    put:
      tags: [storage-units]
      operationId: updateStorageAllocation
      summary: 収納割当の数量を変更する
      description: |
        割当自身の `expectedVersion` と収納単位の
        `expectedStorageUnitVersion` の双方を検証する。
        成功時は割当と収納単位の両方のversionを1増加させる。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageAllocationRequest"
      responses:
        "200":
          description: 変更に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [storage-units]
      operationId: deleteStorageAllocation
      summary: 収納割当を削除する
      description: |
        物理削除する。割当は「今どこに入っているか」を表す現在状態であり、
        取り出した履歴を保持する要件が無いためsoft deleteとしない。

        bodyを持たないmethodのため、version値はquery parameterで受け取る
        (`deleteTag` と同じ方針)。

        更新後の収納単位versionをクライアントへ返す必要があるため、
        204ではなく 200 で収納内容を返す。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          description: 収納割当の現在version (設計書 11.7)
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: expectedStorageUnitVersion
          in: query
          required: true
          description: 収納単位の現在version。割当集合の競合を検知する。
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: 削除に成功した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: less_session
      description: |
        session token Cookie。HttpOnly、SameSite=Lax、本番環境ではSecureを付与する。
        実際のCookie名は環境変数 `SESSION_COOKIE_NAME` で変更できる。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF token。非HttpOnly Cookie `less_csrf` の値をそのまま送信する
        (signed double-submit cookie)。state変更requestで必須とする。

  parameters:
    PublicIdPathParameter:
      name: publicId
      in: path
      required: true
      description: 外部公開ID。内部IDはAPIへ公開しない (設計書 12.1)。
      schema:
        type: string
        format: uuid
    AllocationPublicIdPathParameter:
      name: allocationPublicId
      in: path
      required: true
      description: 収納割当の外部公開ID。
      schema:
        type: string
        format: uuid
    LimitQueryParameter:
      name: limit
      in: query
      description: 取得件数。未指定時は50。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
    OffsetQueryParameter:
      name: offset
      in: query
      description: 読み飛ばす件数。未指定時は0。
      schema:
        type: integer
        format: int32
        minimum: 0

  responses:
    BadRequest:
      description: request形式が不正である
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BAD_REQUEST
            message: リクエストの形式が正しくありません。
            fieldErrors:
              - field: email
                code: INVALID_FORMAT
                message: メールアドレスの形式が正しくありません。
            requestId: req_01JQ0000000000000000000000
    Unauthorized:
      description: 未認証である
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHENTICATED
            message: ログインが必要です。
            fieldErrors: []
            requestId: req_01JQ0000000000000000000000
    Forbidden:
      description: CSRF検証に失敗した、または操作が許可されていない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CSRF_TOKEN_INVALID
            message: セキュリティトークンが無効です。画面を再読み込みしてください。
            fieldErrors: []
            requestId: req_01JQ0000000000000000000000
    NotFound:
      description: |
        対象が存在しない。
        他ユーザーのpublicIdを指定した場合も本statusを返し、存在有無を公開しない (設計書 18.3)。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ITEM_NOT_FOUND
            message: アイテムが見つかりません。
            fieldErrors: []
            requestId: req_01JQ0000000000000000000000
    Conflict:
      description: version競合、unique競合、状態競合が発生した
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ITEM_VERSION_CONFLICT
            message: アイテムが別の操作で更新されています。最新の内容を読み込み直してください。
            fieldErrors: []
            requestId: req_01JQ0000000000000000000000
    UnprocessableEntity:
      description: 業務ルールに違反している
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: request回数の上限を超えた
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: TOO_MANY_REQUESTS
            message: 試行回数が多すぎます。しばらく待ってから再度お試しください。
            fieldErrors: []
            requestId: req_01JQ0000000000000000000000
    InternalServerError:
      description: 予期しないerrorが発生した
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_SERVER_ERROR
            message: サーバーでエラーが発生しました。
            fieldErrors: []
            requestId: req_01JQ0000000000000000000000

  schemas:
    ErrorResponse:
      type: object
      description: 全endpointで共通のerror形式 (設計書 12.3)
      required: [code, message, fieldErrors, requestId]
      properties:
        code:
          type: string
          description: 機械判定用のerror code (SCREAMING_SNAKE_CASE)
          example: EMAIL_ALREADY_REGISTERED
        message:
          type: string
          description: 利用者向けmessage。内部stack traceを含めない。
        fieldErrors:
          type: array
          description: 入力項目単位のerror
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type: string
          description: server logと突き合わせるためのrequest ID

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: requestBodyのfield名 (camelCase)
          example: password
        code:
          type: string
          example: TOO_SHORT
        message:
          type: string
          example: パスワードは12文字以上で入力してください。

    RegisterUserRequest:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: |
            大文字小文字を区別せず一意とする。
            x-go-typeでGo側をstringとし、形式検証はDomainのEmail ValueObjectへ集約する。
            これによりfieldErrorsへ `email` を含むresponseを返せる。
          x-go-type: string
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Argon2idでhash化して保存する。平文は保存・log出力しない。
          example: correct-horse-battery
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          example: 山田太郎
        timezone:
          type: string
          maxLength: 64
          description: |
            IANA timezone名。未指定時はserverがAsia/Tokyoを適用する。
            既定値の適用はserverの責務のため、schemaへdefaultを記述しない。
          example: Asia/Tokyo
        locale:
          type: string
          maxLength: 16
          description: 未指定時はserverがja-JPを適用する。
          example: ja-JP

    LoginUserRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-go-type: string
          example: user@example.com
        password:
          type: string
          format: password
          maxLength: 128
          example: correct-horse-battery

    UserResponse:
      type: object
      description: 内部IDを含めない (設計書 12.1)
      required:
        [publicId, email, displayName, timezone, locale, createdAt, updatedAt]
      additionalProperties: false
      properties:
        publicId:
          type: string
          format: uuid
          example: 018f8d0a-1c2b-7a3d-9e4f-5a6b7c8d9e0f
        email:
          type: string
          format: email
          x-go-type: string
          example: user@example.com
        displayName:
          type: string
          example: 山田太郎
        timezone:
          type: string
          example: Asia/Tokyo
        locale:
          type: string
          example: ja-JP
        createdAt:
          type: string
          format: date-time
          example: "2026-07-25T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-25T00:00:00Z"

    AuthenticatedUserContextResponse:
      type: object
      description: |
        認証済みユーザーのcontext。
        将来の設定値追加に備えてuserをnestした形とする。
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"

    # ---------------------------------------------------------------------
    # enum (設計書 6.2: lowercase snake_case)
    # ---------------------------------------------------------------------
    ItemKindCode:
      type: string
      description: |
        アイテム種別。設計書 13.7 は種別の存在のみを定め、値集合を定義していない。
        12.5 の例 `durable` を基に、耐久品と消耗品の2値で開始する。
      enum: [durable, consumable]
      example: durable

    NecessityLevelCode:
      type: string
      description: 必要度 (設計書 14.5)
      enum: [essential, important, optional, undecided, unnecessary]
      example: essential

    UsageFrequencyCode:
      type: string
      description: 使用頻度 (設計書 14.3)
      enum: [daily, weekly, monthly, quarterly, yearly, rarely, never]
      example: monthly

    SubstitutabilityCode:
      type: string
      description: 代替可能性 (設計書 14.4)
      enum: [none, partial, full, unknown]
      example: none

    MobilityClassCode:
      type: string
      description: 携行区分 (設計書 16.1)
      enum:
        [
          worn,
          pocket,
          daily_bag,
          on_demand,
          self_carry,
          parcel,
          mover,
          dispose_rebuy,
          fixed,
        ]
      example: daily_bag

    StorageTypeCode:
      type: string
      description: |
        収納単位の種別。設計書 13.8 は `bag、pouch、box等` と例示のみで
        値集合を定義していないため、実運用で必要な7値で開始する。
      enum: [bag, pouch, box, shelf, room, appliance, other]
      example: bag

    ItemSortKey:
      type: string
      description: 所持品一覧の並び替えkey
      enum: [name, quantity, lastUsedAt, updatedAt]
      example: updatedAt

    StorageUnitSortKey:
      type: string
      description: |
        収納単位一覧の並び替えkey。
        `totalWeightGram` はDBへ保存しない集計値のためsort keyへ含めない。
      enum: [name, sortOrder, updatedAt]
      example: sortOrder

    SortOrder:
      type: string
      enum: [asc, desc]
      example: desc

    # ---------------------------------------------------------------------
    # 共通
    # ---------------------------------------------------------------------
    PaginationResponse:
      type: object
      description: |
        offset paginationの結果 (本file冒頭の注記を参照)。
      required: [limit, offset, totalCount, hasNext]
      additionalProperties: false
      properties:
        limit:
          type: integer
          format: int32
          example: 50
        offset:
          type: integer
          format: int32
          example: 0
        totalCount:
          type: integer
          format: int64
          description: 絞り込み条件に一致する総件数
          example: 128
        hasNext:
