        disposalCondition:
          type: string
          nullable: true
          example: 破損して修理不能になった場合
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        purchasedOn:
          type: string
          format: date
          nullable: true
        purchaseAmount:
          type: integer
          format: int64
          nullable: true
          description: 購入金額 (円)。丸め誤差を避けるため整数で扱う (設計書 11章)。
        replacementAmount:
          type: integer
          format: int64
          nullable: true
        resaleAmount:
          type: integer
          format: int64
          nullable: true
        weightGram:
          type: integer
          format: int32
          nullable: true
        volumeMilliliter:
          type: integer
          format: int32
          nullable: true
        isFragile:
          type: boolean
        isValuable:
          type: boolean
        isSentimental:
          type: boolean
        requiresMaintenance:
          type: boolean
        expiresOn:
          type: string
          format: date
          nullable: true
        sourceUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
        notes:
          type: string
          nullable: true
        isConfirmed:
          type: boolean
          description: |
            棚卸し確認済みか (設計書 13.7)。
